[package]
name = "aan-tv"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Package allowing to build WASM binary for the program and IDL file for it"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
aan-tv-app.workspace = true
sails-rs.workspace = true

[dev-dependencies]
aan-tv-app.workspace = true
aan-tv-client.workspace = true
sails-rs = { workspace = true, features = ["gtest", "gclient"] }
tokio = { workspace = true, features = ["rt", "macros"] }
sha2 = "0.10"

[build-dependencies]
aan-tv-app.workspace = true
sails-rs = { workspace = true, features = ["build"] }

[workspace]
resolver = "3"
members = ["app", "client"]

[workspace.package]
version = "0.1.0"
authors = ["agent-arena-op"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/timidan/aan-tv"
license = "MIT"
keywords = ["gear", "sails", "smart-contracts", "wasm", "no-std"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
sails-rs = "0.10.4"
tokio = "1.48.0"
aan-tv-app = { version = "0.1.0", path = "app" }
aan-tv-client = { version = "0.1.0", path = "client" }
parity-scale-codec = { version = "=3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
